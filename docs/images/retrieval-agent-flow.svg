<svg xmlns="http://www.w3.org/2000/svg" width="680" height="476" viewBox="0 0 680 476" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Information retrieval agent flow</title><desc>A user prompt goes through RAGClient to the RAG service, then context formatting, then the Ollama model, and returns an answer with raw context and cited sources.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="476" fill="#FFFFFF"/><rect x="190" y="30" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A" x="320.0" y="52.0" text-anchor="middle" dominant-baseline="central">User prompt</text><rect x="190" y="110" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="320.0" y="128" text-anchor="middle" dominant-baseline="central">RAGClient</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7" x="320.0" y="148" text-anchor="middle" dominant-baseline="central">Validates input, top_k 1..100</text><rect x="490" y="110" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13" x="565.0" y="128" text-anchor="middle" dominant-baseline="central">RAG service</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D" x="565.0" y="148" text-anchor="middle" dominant-baseline="central">POST /query</text><rect x="190" y="200" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="320.0" y="218" text-anchor="middle" dominant-baseline="central">Context formatting</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7" x="320.0" y="238" text-anchor="middle" dominant-baseline="central">retrieved_documents + sources</text><rect x="190" y="290" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="320.0" y="308" text-anchor="middle" dominant-baseline="central">Model.chat</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7" x="320.0" y="328" text-anchor="middle" dominant-baseline="central">Provider-neutral Model</text><rect x="490" y="290" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13" x="565.0" y="308" text-anchor="middle" dominant-baseline="central">Ollama server</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D" x="565.0" y="328" text-anchor="middle" dominant-baseline="central">OLLAMA_HOST</text><rect x="190" y="380" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A" x="320.0" y="398" text-anchor="middle" dominant-baseline="central">Agent result</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" x="320.0" y="418" text-anchor="middle" dominant-baseline="central">answer, raw context, sources</text><line x1="320" y1="74" x2="320" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="320" y1="166" x2="320" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="320" y1="256" x2="320" y2="288" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="320" y1="346" x2="320" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="452" y1="138" x2="488" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/><line x1="452" y1="318" x2="488" y2="318" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/></svg>