<svg xmlns="http://www.w3.org/2000/svg" width="680" height="514" viewBox="0 0 680 514" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>RTA system structure</title><desc>CLI feeds an orchestrator with planner, recon, analysis, reporter and retrieval agents. Agents call Ollama and the RAG service. Commands pass guardrails, operator approval and a Docker executor.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="514" fill="#FFFFFF"/><rect x="240" y="30" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A" x="340.0" y="52.0" text-anchor="middle" dominant-baseline="central">CLI</text><line x1="340" y1="74" x2="340" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="110" width="600" height="140" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A" x="60" y="132" dominant-baseline="central">Orchestrator and agents</text><rect x="60" y="160" width="100" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="110.0" y="188.0" text-anchor="middle" dominant-baseline="central">Planner</text><rect x="172" y="160" width="100" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="222.0" y="188.0" text-anchor="middle" dominant-baseline="central">Recon</text><rect x="284" y="160" width="100" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="334.0" y="188.0" text-anchor="middle" dominant-baseline="central">Analysis</text><rect x="396" y="160" width="100" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="446.0" y="188.0" text-anchor="middle" dominant-baseline="central">Reporter</text><rect x="508" y="160" width="112" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="564.0" y="188.0" text-anchor="middle" dominant-baseline="central">Retrieval</text><rect x="40" y="290" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A" x="125.0" y="312.0" text-anchor="middle" dominant-baseline="central">Ollama LLM</text><rect x="230" y="290" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A" x="315.0" y="312.0" text-anchor="middle" dominant-baseline="central">RAG service</text><line x1="125" y1="250" x2="125" y2="288" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="315" y1="250" x2="315" y2="288" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="540" y1="250" x2="540" y2="288" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="552" y="270" text-anchor="start" dominant-baseline="central">Commands</text><rect x="440" y="290" width="200" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13" x="540.0" y="312.0" text-anchor="middle" dominant-baseline="central">Scope guardrails</text><rect x="440" y="358" width="200" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13" x="540.0" y="380.0" text-anchor="middle" dominant-baseline="central">Operator approval</text><rect x="440" y="426" width="200" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13" x="540.0" y="448.0" text-anchor="middle" dominant-baseline="central">Docker executor</text><line x1="540" y1="334" x2="540" y2="356" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="540" y1="402" x2="540" y2="424" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="430" width="24" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="76" y="437" text-anchor="start" dominant-baseline="central">Implemented</text><rect x="40" y="454" width="24" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="76" y="461" text-anchor="start" dominant-baseline="central">Planned</text></svg>