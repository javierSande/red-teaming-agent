<svg xmlns="http://www.w3.org/2000/svg" width="680" height="514" viewBox="0 0 680 514" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>RTA command lifecycle</title><desc>An agent proposes a command. It passes a scope validator, a syntax sanitizer and operator approval. Any failure returns it to the agent as blocked. Approved commands run in the Docker sandbox and output returns to the agent.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="514" fill="#FFFFFF"/><rect x="100" y="30" width="240" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="220.0" y="52.0" text-anchor="middle" dominant-baseline="central">Agent proposes command</text><rect x="100" y="110" width="240" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13" x="220.0" y="132.0" text-anchor="middle" dominant-baseline="central">Scope validator</text><rect x="100" y="190" width="240" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13" x="220.0" y="212.0" text-anchor="middle" dominant-baseline="central">Syntax sanitizer</text><rect x="100" y="270" width="240" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13" x="220.0" y="292.0" text-anchor="middle" dominant-baseline="central">Operator approval (y/N)</text><rect x="100" y="350" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A" x="220.0" y="372.0" text-anchor="middle" dominant-baseline="central">Docker sandbox runs it</text><rect x="100" y="430" width="240" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489" x="220.0" y="452.0" text-anchor="middle" dominant-baseline="central">Output returns to agent</text><rect x="440" y="110" width="200" height="204" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13" x="540.0" y="194" text-anchor="middle" dominant-baseline="central">Blocked</text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D" x="540.0" y="214" text-anchor="middle" dominant-baseline="central">Returned to the agent</text><line x1="220" y1="74" x2="220" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="220" y1="154" x2="220" y2="188" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="220" y1="234" x2="220" y2="268" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="220" y1="314" x2="220" y2="348" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="220" y1="394" x2="220" y2="428" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="232" y="331" text-anchor="start" dominant-baseline="central">Approved</text><line x1="342" y1="132" x2="438" y2="132" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="390" y="118" text-anchor="middle" dominant-baseline="central">Out of scope</text><line x1="342" y1="212" x2="438" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="390" y="198" text-anchor="middle" dominant-baseline="central">Unsafe syntax</text><line x1="342" y1="292" x2="438" y2="292" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441" x="390" y="278" text-anchor="middle" dominant-baseline="central">Operator: N</text></svg>